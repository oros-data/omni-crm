name: omni-crm
services:
  postgres:
    container_name: omni-crm-postgres
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omni_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omni_crm}
      POSTGRES_DB: ${POSTGRES_DB:-omni_crm}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - omni-crm-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  omni-crm-pgdata:
